<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Environment Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tailwind config for dark mode
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {},
        }
      }
    </script>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
      body { background-color: #0b1220; }
    </style>
  </head>
  <body class="min-h-screen text-gray-100 antialiased bg-gradient-to-b from-slate-900 via-slate-950 to-black">
    <div class="max-w-6xl mx-auto p-6">
      <header class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-semibold tracking-tight">Environment Dashboard</h1>
        <div class="space-x-2">
          <button id="btn-24h" class="time-btn px-3 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-sm">Last 24 Hours</button>
          <button id="btn-7d" class="time-btn px-3 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-sm">Last 7 Days</button>
          <button id="btn-1m" class="time-btn px-3 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-sm">Last 1 Month</button>
        </div>
      </header>

      <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="p-4 rounded-xl bg-gradient-to-br from-slate-900/60 to-slate-800/40 border border-slate-700">
          <h2 class="text-sm text-slate-300 mb-2">Temperature</h2>
          <div id="chart-temp" class="h-80"></div>
        </div>

        <div class="p-4 rounded-xl bg-gradient-to-br from-slate-900/60 to-slate-800/40 border border-slate-700">
          <h2 class="text-sm text-slate-300 mb-2">Humidity</h2>
          <div id="chart-hum" class="h-80"></div>
        </div>
      </section>

      <footer class="mt-6 text-sm text-slate-500">Data source: local PostgreSQL. Charts update smoothly when timeframe changes.</footer>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
